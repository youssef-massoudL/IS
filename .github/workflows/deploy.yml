name: Deploy study site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest against files/
        run: node scripts/build.mjs --check

      - name: Build ZIP archives
        shell: pwsh
        run: ./scripts/build-zips.ps1 -Quiet

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html robots.txt .nojekyll _site/
          cp -r assets data files downloads _site/
          du -sh _site
          find _site -maxdepth 2 -type d | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
